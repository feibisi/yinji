<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Stamper - 现代化PDF盖章工具</title>
    <meta
      name="description"
      content="PDF Stamper - 免费在线PDF盖章工具，拥有现代化UI和交互体验，支持普通印章和骑缝章，所有操作均在本地完成，保护您的隐私安全。"
    />
    <meta
      name="keywords"
      content="PDF Stamper,PDF盖章,电子印章,骑缝章,在线工具,PDF处理,免费盖章,现代化UI"
    />
    <link rel="stylesheet" href="src/style.css">
  </head>
  <body>
    <div id="app" class="sidebar-visible no-pdf-loaded">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-title">页面预览</h2>
          <button id="sidebar-toggle" class="sidebar-toggle-btn" title="收起/展开侧边栏">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
          </button>
        </div>
        <!-- 批量操作工具栏 -->
        <div class="batch-toolbar" id="batch-toolbar" style="display:none;">
          <div class="batch-info">
            <span id="selected-pages-list"></span>
            <span class="batch-count">已选 <span id="selected-count">0</span> 页</span>
          </div>
          <div class="batch-actions">
            <button class="btn btn-sm btn-secondary" id="select-all-pages-btn">全选</button>
            <button class="btn btn-sm btn-secondary" id="clear-selection-btn">清除选择</button>
            <button class="btn btn-sm btn-primary" id="batch-add-seal-btn">批量添加印章</button>
            <button class="btn btn-sm btn-danger" id="batch-delete-stamps-btn">批量删除印章</button>
          </div>
        </div>
        <div class="thumbnail-container" id="thumbnail-container">
          <div class="empty-state">
             <p>请先上传PDF文件</p>
          </div>
        </div>
      </aside>

      <main class="main-content-wrapper">
        <div class="main-content" id="main-content">
          <div id="drop-zone" class="drop-zone">
              <div class="drop-zone-prompt">
                  <img src="public/drag-drop-icon.svg" alt="拖拽上传" width="80">
                  <h2>将 PDF 文件拖拽到此处</h2>
                  <p>或</p>
                  <br>
                  <button class="btn btn-primary" id="upload-pdf-btn-main">选择文件</button>
                  <input type="file" id="pdfInput" accept=".pdf" hidden />
              </div>
          </div>
        </div>
        <div class="main-content-footer">
          <div class="page-navigator">
            <span id="page-indicator">第 - / - 页</span>
            <select id="page-selector" class="page-selector" title="快速跳转页面"></select>
          </div>
          <div class="zoom-controls">
            <label for="zoom-slider">缩放:</label>
            <input type="range" id="zoom-slider" min="0.5" max="2" value="1" step="0.1" list="zoom-markers">
            <span id="zoom-value">100% (Fit-Width)</span>
          </div>
        </div>
      </main>

      <datalist id="zoom-markers">
        <option value="1" label="100%"></option>
      </datalist>

      <aside class="toolbar" id="toolbar">
        <div class="toolbar-header">
          <div>
            <h1>PDF Stamper</h1>
            <p>现代化 PDF 盖章工具</p>
          </div>
          <div class="header-actions">
            <button id="settingsBtn" class="icon-btn" title="设置"><i data-lucide="settings"></i></button>
            <button id="helpBtn" class="icon-btn" title="键盘快捷键"><i data-lucide="help-circle"></i></button>
          </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-navigation">
          <button class="tab-btn active" data-tab="edit"><i data-lucide="edit"></i> 编辑</button>
          <button class="tab-btn" data-tab="export"><i data-lucide="download"></i> 导出</button>
        </div>

        <!-- Tab Content -->
        <div class="tab-content-wrapper">
          <!-- Tab 1: 编辑 -->
          <div class="tab-panel active" id="tab-edit">
            <div class="tool-section">
              <h3>印章设置</h3>
              <div class="seal-preview-container">
                <img id="seal-preview" src="" alt="印章预览" class="seal-preview-image hidden">
                <div id="seal-placeholder" class="seal-preview-placeholder">
                  <span>印章预览</span>
                </div>
              </div>
              <div class="button-group button-grid-2">
                <button class="btn btn-secondary" id="upload-seal-btn">选择 印章/签名</button>
                <button class="btn btn-action" id="remove-bg-btn" title="去除图片白色背景，使其透明">一键去白底</button>
              </div>
              <input type="file" id="sealInput" accept="image/*" hidden />
              <div class="rotation-controls">
                <label for="rotation-slider">旋转:</label>
                <input type="range" id="rotation-slider" min="-180" max="180" value="0" step="1">
                <input type="number" id="rotation-input" min="-180" max="180" value="0" class="rotation-input-box">
                <span>°</span>
              </div>
              <div class="rotation-controls">
                <label for="brightness-slider">亮度:</label>
                <input type="range" id="brightness-slider" min="0" max="200" value="100" step="1">
                <span id="brightness-value">100%</span>
              </div>
              <div class="button-group button-grid-2">
                <button id="addSeal" class="btn btn-action">添加普通章</button>
                <button id="addStraddle" class="btn btn-action">添加骑缝章</button>
              </div>
              <div class="button-group">
                <button class="btn btn-secondary" id="save-seal-btn">保存到印章库</button>
              </div>
              <!-- 精确坐标定位 -->
              <div class="coord-controls">
                <label>X:</label>
                <input type="number" id="coord-x" class="coord-input" step="1" min="0" placeholder="0">
                <label>Y:</label>
                <input type="number" id="coord-y" class="coord-input" step="1" min="0" placeholder="0">
              </div>
              <!-- 编辑操作 -->
              <div class="button-group button-grid-2">
                <button class="btn btn-secondary" id="copy-stamp-btn" title="复制选中 (Ctrl+C)">复制</button>
                <button class="btn btn-secondary" id="paste-stamp-btn" title="粘贴 (Ctrl+V)">粘贴</button>
              </div>
              <div class="button-group button-grid-2">
                <button class="btn btn-secondary" id="lock-stamp-btn" title="锁定/解锁 (Ctrl+L)">锁定</button>
                <button class="btn btn-secondary" id="guideline-toggle-btn" title="切换对齐辅助线">辅助线</button>
              </div>
            </div>
            <div class="tool-section">
              <h3>签名</h3>
              <div class="button-group">
                <button id="addSignature" class="btn btn-action"><i data-lucide="pen-tool" style="width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:4px;"></i> 手写签名</button>
              </div>
            </div>
            <div class="tool-section">
              <h3>印章库</h3>
              <div id="seal-library-container"></div>
            </div>
          </div>

          <!-- Tab 2: 导出 -->
          <div class="tab-panel" id="tab-export">
            <div class="tool-section">
              <h3>导出当前文件</h3>
              <button id="exportPDF" class="btn btn-primary btn-export">导出盖章 PDF</button>
            </div>
            <div class="tool-section">
              <h3>批量导出</h3>
              <div class="button-group">
                <button class="btn btn-secondary" id="export-selected-btn" title="导出选中的页面">导出选中页面</button>
                <button class="btn btn-secondary" id="export-all-btn" title="导出全部页面">导出全部页面</button>
                <button class="btn btn-secondary" id="export-split-btn" title="每页独立导出为单个文件">分别导出</button>
              </div>
              <p id="export-hint" style="font-size:0.75rem;color:var(--text-color-secondary);margin-top:0.5rem;"></p>
            </div>
            <div class="tool-section">
              <h3>批量处理</h3>
              <div class="button-group">
                <button class="btn btn-secondary" id="upload-batch-btn">添加批量文件</button>
                <input type="file" id="batchInput" accept=".pdf" multiple hidden />
              </div>
              <div id="batch-file-list" class="batch-file-list"></div>
              <div class="button-group">
                <button id="processBatch" class="btn btn-primary">开始批量处理</button>
                <button id="clearBatch" class="btn btn-danger">清空队列</button>
              </div>
            </div>
          </div>
        </div>

        <div class="toolbar-footer">
          <p>所有操作均在本地完成。</p>
          <a href="https://www.modiqi.com" target="_blank" rel="noopener noreferrer">莫蒂奇数字技术（苏州）有限公司</a>
        </div>
      </aside>
    </div>

    <script
      type="module"
      src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
      integrity="sha384-+0ti2moQlmLN7WZHE2RHIf5lV8hHxhxEalN0il3YZceG26fUPyOkR0hp9daxk1i7"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/fabric@6.6.1/dist/index.min.js"
      integrity="sha384-E+yJ0X86m1UfH+Y1i518CAcMolreugTFzpZC0jw6MktyVBgWBI7+zWXvQwKif/Kb"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"
      integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"
      integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM"
      crossorigin="anonymous"
    ></script>
    <script src="src/utils/validators.js"></script>
    <script src="src/ui/notifications.js"></script>
    <script src="src/ui/loading.js"></script>
    <script src="src/core/state.js"></script>
    <script src="src/core/history.js"></script>
    <script src="src/core/seal-library.js"></script>
    <script src="src/core/batch-processing.js"></script>
    <script src="src/core/settings.js"></script>
    <script src="src/main.js"></script>

    <!-- 签名模态框 -->
    <div id="signature-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>手写签名</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <canvas id="signature-canvas" width="600" height="300"></canvas>
          <p class="modal-hint">请在上方区域书写您的签名</p>
        </div>
        <div class="modal-footer">
          <button id="clear-signature-btn" class="btn btn-secondary">清除</button>
          <button id="confirm-signature-btn" class="btn btn-primary">确认添加</button>
        </div>
      </div>
    </div>

    <!-- 右键菜单 -->
    <div id="context-menu" class="context-menu hidden">
      <div class="context-menu-item" data-action="delete">
        <i data-lucide="trash-2"></i>
        <span>删除</span>
        <span class="context-menu-shortcut">Del</span>
      </div>
      <div class="context-menu-item" data-action="copy">
        <i data-lucide="copy"></i>
        <span>复制</span>
        <span class="context-menu-shortcut">Ctrl+C</span>
      </div>
      <div class="context-menu-item" data-action="paste">
        <i data-lucide="clipboard"></i>
        <span>粘贴</span>
        <span class="context-menu-shortcut">Ctrl+V</span>
      </div>
      <div class="context-menu-item" data-action="toggle-lock">
        <i data-lucide="lock"></i>
        <span>锁定/解锁</span>
        <span class="context-menu-shortcut">Ctrl+L</span>
      </div>
      <div class="context-menu-divider"></div>
      <div class="context-menu-item" data-action="undo">
        <i data-lucide="undo"></i>
        <span>撤销</span>
        <span class="context-menu-shortcut">Ctrl+Z</span>
      </div>
      <div class="context-menu-item" data-action="redo">
        <i data-lucide="redo"></i>
        <span>重做</span>
        <span class="context-menu-shortcut">Ctrl+Y</span>
      </div>
    </div>

    <script>
      // 初始化 Lucide 图标
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
      } else {
        lucide.createIcons();
      }
    </script>
  </body>
</html>
